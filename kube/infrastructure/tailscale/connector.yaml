apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: homelab-k8s-router
spec:
  replicas: 2

  hostnamePrefix: homelab-k8s-router

  tags:
    - "tag:homelab-k8s-router"

  subnetRouter:
    advertiseRoutes:
      - "192.168.0.16/32" # NAS-White
      - "192.168.0.17/32" # NAS-Black
      - "192.168.0.20/32" # Kube VIP
      - "192.168.0.21/32" # Talos CP1
      - "192.168.0.22/32" # Talos CP2
      - "192.168.0.23/32" # Talos CP3
