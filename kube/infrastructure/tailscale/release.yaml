apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  timeout: 10m

  chart:
    spec:
      chart: tailscale-operator
      version: "1.102.3"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    installCRDs: true

    operatorConfig:
      hostname: homelab-k8s-operator
      defaultTags:
        - "tag:homelab-k8s-operator"

    proxyConfig:
      defaultTags: "tag:homelab-k8s-router"
