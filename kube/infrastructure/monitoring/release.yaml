apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 20m

  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.6.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h

  install:
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3

  values:
    defaultRules:
      create: true

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password

      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: browser

      ingress:
        enabled: false

      persistence:
        enabled: true
        type: sts
        storageClassName: longhorn-r2
        accessModes:
          - ReadWriteOnce
        size: 2Gi

    prometheus:
      prometheusSpec:
        retention: 15d
        retentionSize: "25GB"
        scrapeInterval: 30s
        evaluationInterval: 30s
        walCompression: true

        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}

        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}

        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}

        serviceMonitorNamespaceSelector: {}
        podMonitorNamespaceSelector: {}
        ruleNamespaceSelector: {}

        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-r2
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 30Gi

    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn-r2
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi

    kubeEtcd:
      enabled: true
      endpoints:
        - 192.168.0.21
        - 192.168.0.22
        - 192.168.0.23
      service:
        enabled: true
        port: 2381
        targetPort: 2381
      serviceMonitor:
        enabled: true
        scheme: http

    kubeControllerManager:
      enabled: true
      endpoints:
        - 192.168.0.21
        - 192.168.0.22
        - 192.168.0.23
      service:
        enabled: true
        port: 10257
        targetPort: 10257
      serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true

    kubeScheduler:
      enabled: true
      endpoints:
        - 192.168.0.21
        - 192.168.0.22
        - 192.168.0.23
      service:
        enabled: true
        port: 10259
        targetPort: 10259
      serviceMonitor:
        enabled: true
        https: true
        insecureSkipVerify: true

    kubeProxy:
      enabled: true
      service:
        enabled: true
        port: 10249
        targetPort: 10249
      serviceMonitor:
        enabled: true
        https: false

    kubeStateMetrics:
      enabled: true

    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      namespaceOverride: kube-system
