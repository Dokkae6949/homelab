apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: traefik
      version: "41.3.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      replicas: 2
    service:
      type: ClusterIP
    ports:
      web:
        forwardedHeaders:
          # cloudflared runs on the cluster Pod network. Preserve Cloudflare's
          # original X-Forwarded-* values without trusting arbitrary clients.
          trustedIPs:
            - 10.244.0.0/16
    ingressClass:
      enabled: true
      isDefaultClass: true
    providers:
      kubernetesIngress:
        enabled: true
    ingressRoute:
      dashboard:
        enabled: false
    metrics:
      prometheus:
        service:
          enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
        addRoutersLabels: true
        headerLabels:
          host: X-Forwarded-Host
        buckets: 0.005,0.01,0.025,0.05,0.1,0.25,0.5,1.0,2.5,5.0,10.0
