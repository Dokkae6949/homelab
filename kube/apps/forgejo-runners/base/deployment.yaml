apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
spec:
  # Each overlay enables exactly one replica after credentials are supplied.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
      annotations:
        dokkae.com/config-revision: "1"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: forgejo-runner
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: docker
          # Native sidecar: ready before the runner; stopped after the runner.
          restartPolicy: Always
          image: docker.io/library/docker:29.8.1-dind@sha256:3f3c01aaaebf7cce837356b688b7c059a4749f10bd7660dec7c58fc454a283f0
          # Explicit dockerd bypasses automatic TCP listeners but retains DinD setup.
          command: [dockerd-entrypoint.sh]
          args:
            - dockerd
            - --host=unix:///run/docker/docker.sock
            - --group=1000
            - --storage-driver=overlay2
            - --feature=containerd-snapshotter=false
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 20Gi
          startupProbe:
            exec:
              command: [docker, --host=unix:///run/docker/docker.sock, info]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [docker, --host=unix:///run/docker/docker.sock, info]
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: docker-socket
              mountPath: /run/docker
            - name: docker-data
              mountPath: /var/lib/docker
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:13.2.0@sha256:ca3d5eea46004789a175d1369eec6829d3ea9bfbe2011a06625b4bdaa55f7552
          command: [/usr/bin/dumb-init, --, forgejo-runner]
          args:
            - daemon
            - --config=/config/config.yaml
            - --url=$(FORGEJO_INSTANCE_URL)
            - --uuid=$(RUNNER_UUID)
            - --token-url=file:/credentials/token
          env:
            - name: FORGEJO_INSTANCE_URL
              valueFrom:
                configMapKeyRef:
                  name: forgejo-runner-instance
                  key: FORGEJO_INSTANCE_URL
            - name: RUNNER_UUID
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-credentials
                  key: uuid
            - name: DOCKER_HOST
              value: unix:///run/docker/docker.sock
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /cache
            - name: credentials
              mountPath: /credentials
              readOnly: true
            - name: config
              mountPath: /config
              readOnly: true
            - name: docker-socket
              mountPath: /run/docker
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: forgejo-runner-config
        - name: credentials
          secret:
            secretName: forgejo-runner-credentials
            defaultMode: 0440
            items:
              - key: token
                path: token
        - name: cache
          persistentVolumeClaim:
            claimName: forgejo-runner-cache
        - name: data
          emptyDir:
            sizeLimit: 1Gi
        - name: docker-socket
          emptyDir: {}
        - name: docker-data
          emptyDir:
            sizeLimit: 20Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
