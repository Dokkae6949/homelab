apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie

  enableSuperuserAccess: false

  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  bootstrap:
    initdb:
      database: app
      owner: app
      dataChecksums: true

  managed:
    roles:
      - name: synapse
        ensure: present
        login: true
        superuser: false
        createrole: false
        connectionLimit: 12
        passwordSecret:
          name: synapse-posgres-user

  storage:
    storageClass: longhorn-r2
    size: 40Gi
