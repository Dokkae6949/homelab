apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: matrix-well-known
    namespace: synapse
    files:
      - nginx.conf=nginx.conf
      - default.conf=well-known.conf
resources:
  - namespace.yaml
  - secrets.sops.yaml
  - signing-key.sops.yaml
  - config.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - well-known.yaml
