apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: synapse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synapse
      annotations:
        # Bump when config or startup-consumed Secrets change.
        dokkae.com/config-revision: "1"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
        fsGroup: 991
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: render-config
          image: ghcr.io/element-hq/synapse:v1.159.0@sha256:edf259d2b575b669a3e81024918ab8d5cfb7d2fba5a53c9e09695f1abc5645cb
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import json
              from pathlib import Path

              template = Path("/template/homeserver.yaml").read_text()
              password = Path("/run/secrets/main/database-password").read_text().strip()
              rendered = template.replace("__DATABASE_PASSWORD__", json.dumps(password))
              Path("/config/homeserver.yaml").write_text(rendered)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config-template
              mountPath: /template
              readOnly: true
            - name: rendered-config
              mountPath: /config
            - name: synapse-secrets
              mountPath: /run/secrets/main
              readOnly: true
            - name: tmp
              mountPath: /tmp

      containers:
        - name: synapse
          image: ghcr.io/element-hq/synapse:v1.159.0@sha256:edf259d2b575b669a3e81024918ab8d5cfb7d2fba5a53c9e09695f1abc5645cb
          imagePullPolicy: IfNotPresent
          env:
            - name: SYNAPSE_CONFIG_PATH
              value: /config/homeserver.yaml
          ports:
            - name: http
              containerPort: 8008
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: rendered-config
              mountPath: /config
              readOnly: true
            - name: synapse-secrets
              mountPath: /run/secrets/main
              readOnly: true
            - name: signing-key
              mountPath: /run/secrets/signing
              readOnly: true
            - name: media
              mountPath: /data/media_store
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: config-template
          configMap:
            name: synapse-config
        - name: rendered-config
          emptyDir: {}
        - name: synapse-secrets
          secret:
            secretName: synapse-secrets
        - name: signing-key
          secret:
            secretName: synapse-signing-key
        - name: media
          persistentVolumeClaim:
            claimName: synapse-media
        - name: tmp
          emptyDir: {}
