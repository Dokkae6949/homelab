machine:
  kubelet:
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: longhorn
provisioning:
  diskSelector:
    match: "disk.transport == 'sata' && !system_disk && disk.size > 400u * GB && disk.size < 600u * GB"
  minSize: 400GB
  grow: true
filesystem:
  type: xfs
